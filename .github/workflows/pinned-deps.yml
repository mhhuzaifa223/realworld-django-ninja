name: Pinned Dependencies

on:
  pull_request:
    branches: ["master"]

jobs:
  pinned-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      - name: Check that uv.lock is up to date
        run: uv lock --check